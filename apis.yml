aid: enechain
name: enechain
description: 'enechain operates the largest energy exchange in Japan, offering trading
  opportunities for wholesale electricity and environmental values across an over-the-counter
  marketplace that connects energy market participants. Headquartered in Tokyo, the
  company builds energy markets that help buyers and sellers discover prices, manage
  risk, and trade power and environmental-value products, under the mission "Building
  Energy Markets, Coloring Our Society." enechain was surfaced in the API Evangelist
  network as a portfolio company of DCM Ventures; it publishes no public developer
  API or documentation surface at this time.'
